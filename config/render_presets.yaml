# Blender渲染预设配置

engine: "EEVEE"  # EEVEE（快速预览）或 CYCLES（高质量）

resolution:
  width: 1920
  height: 1080

# 采样设置
samples:
  eevee: 64
  cycles: 128

# 背景
background:
  type: "gradient"  # solid / gradient / transparent
  color_top: [0.95, 0.95, 0.98]     # 浅灰蓝
  color_bottom: [0.85, 0.85, 0.90]

# 三点布光
lighting:
  key_light:
    type: "AREA"
    position: [-2, -2, 3]
    energy: 500
    size: 2
    color: [1.0, 0.98, 0.95]  # 暖白
  fill_light:
    type: "AREA"
    position: [2, -1, 2]
    energy: 200
    size: 3
    color: [0.9, 0.93, 1.0]   # 冷白
  rim_light:
    type: "AREA"
    position: [0, 3, 2.5]
    energy: 300
    size: 1.5
    color: [1.0, 1.0, 1.0]

# 相机角度预设
cameras:
  front:
    position: [0, -3, 1.2]
    look_at: [0, 0, 0.6]
  side_left:
    position: [-3, 0, 1.2]
    look_at: [0, 0, 0.6]
  side_right:
    position: [3, 0, 1.2]
    look_at: [0, 0, 0.6]
  quarter:
    position: [-2.1, -2.1, 1.5]
    look_at: [0, 0, 0.6]
  back:
    position: [0, 3, 1.2]
    look_at: [0, 0, 0.6]

# 地面
ground_plane:
  enabled: true
  shadow_only: true  # 仅显示投影，平面本身透明
