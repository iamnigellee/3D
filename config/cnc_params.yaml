# CNC加工参数配置
# 注意：机床型号未确定，使用通用保守参数
# 上机前务必根据实际机床调整

# 机床信息（待填写）
machine:
  name: "generic_3axis"
  type: "3-axis"         # 3-axis / 4-axis / 5-axis
  controller: "grbl"     # grbl / mach3 / fanuc / siemens
  work_area:
    x: 300               # mm
    y: 300               # mm
    z: 100               # mm

# 通用安全参数
safety:
  safe_height: 10        # 安全高度 mm（快速移动高度）
  retract_height: 2      # 抬刀高度 mm
  stock_margin: 2        # 毛坯余量 mm（每边）

# 加工工序
operations:
  roughing:
    description: "粗加工 - 快速去料"
    tool:
      type: "flat_endmill"
      diameter: 6.0      # mm
      flute_length: 20   # mm
      flutes: 2
    params:
      spindle_speed: 12000   # RPM
      feed_rate: 800         # mm/min
      plunge_rate: 300       # mm/min
      stepdown: 2.0          # 每层切深 mm
      stepover_ratio: 0.4    # 步距比（刀径的40%）
      stock_to_leave: 0.5    # 留余量 mm
    strategy: "adaptive"     # adaptive / zigzag / contour

  semi_finishing:
    description: "半精加工 - 接近最终形状"
    tool:
      type: "ball_endmill"
      diameter: 3.0
      flute_length: 15
      flutes: 2
    params:
      spindle_speed: 15000
      feed_rate: 600
      plunge_rate: 200
      stepdown: 0.5
      stepover_ratio: 0.3
      stock_to_leave: 0.1
    strategy: "contour"

  finishing:
    description: "精加工 - 最终表面"
    tool:
      type: "ball_endmill"
      diameter: 1.0
      flute_length: 10
      flutes: 2
    params:
      spindle_speed: 18000
      feed_rate: 400
      plunge_rate: 150
      stepdown: 0.2
      stepover: 0.05         # 精加工用绝对步距 mm
    strategy: "raster"       # raster / spiral / contour

# 材料预设
materials:
  foam_pu:
    name: "发泡PU"
    spindle_multiplier: 1.2    # 转速倍率
    feed_multiplier: 1.5       # 进给倍率
    coolant: false
  renshape:
    name: "代木(Renshape)"
    spindle_multiplier: 1.0
    feed_multiplier: 1.0
    coolant: false
  resin:
    name: "树脂"
    spindle_multiplier: 0.9
    feed_multiplier: 0.8
    coolant: true
  aluminum:
    name: "铝合金"
    spindle_multiplier: 0.5
    feed_multiplier: 0.4
    coolant: true

# 默认材料
default_material: "foam_pu"

# G-code设置
gcode:
  dialect: "grbl"            # grbl / fanuc / siemens
  units: "mm"                # mm / inch
  line_numbers: false
  comments: true             # 是否包含注释
  header_template: |
    ; Generated by ToyDesign Pipeline
    ; Part: {part_name}
    ; Material: {material}
    ; Date: {date}
    G90 ; 绝对坐标
    G21 ; 毫米单位
    G17 ; XY平面
  footer_template: |
    M5  ; 主轴停止
    G28 ; 回零
    M30 ; 程序结束
